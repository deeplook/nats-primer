[project]
name = "nats-primer"
version = "0.1.0"
description = "A collection of small, self-contained Python scripts for learning NATS on a local machine."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dinu Gherman" },
]
keywords = ["nats", "messaging", "pubsub", "jetstream", "tutorial", "examples"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "faststream>=0.6",
    "nats-py>=2.14",
]

[project.urls]
Repository = "https://github.com/deeplook/nats-primer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
disable_error_code = ["untyped-decorator"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=9.0.3",
]
